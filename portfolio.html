<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tesnim Abdella Profile</title>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="portfolio.css">
</head>

<body>

    <div class="profile-card">

        <!-- Three dots -->
        <div class="dots">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Profile Image -->
        <div class="profile-image">
            <img src="profile.jpg" alt="Tesnim Abdella">
        </div>

        <!-- Name -->
        <h1>Tesnim Abdella</h1>

        <!-- Job -->
        <h2>Frontend Developer</h2>

        <!-- Description -->
        <p class="description">
            I build beautiful, responsive and<br>
            user-friendly websites.
        </p>

        <!-- Social Media -->
        <div class="social-icons">

            <a href="#" class="facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </a>

            <a href="#" class="twitter">
                <i class="fa-brands fa-twitter"></i>
            </a>

            <a href="#" class="linkedin">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>

            <a href="#" class="github">
                <i class="fa-brands fa-github"></i>
            </a>

            <a href="#" class="instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>

        </div>

        <!-- Extra Information -->
        <div class="details">

            <div class="detail">
                <i class="fa-regular fa-calendar-days"></i>

                <div>
                    <span>Joined</span>
                    <p>January 2023</p>
                </div>
            </div>

            <div class="detail">
                <i class="fa-solid fa-location-dot"></i>

                <div>
                    <span>Location</span>
                    <p>Adama, Ethiopia</p>
                </div>
            </div>

            <div class="detail">
                <i class="fa-regular fa-envelope"></i>

                <div>
                    <span>Email</span>
                    <p>tesnim@example.com</p>
                </div>
            </div>

        </div>

        <!-- Button -->
        <button class="profile-button">
            <span class="normal-text">View Profile</span>
            <span class="hover-text">Contact Me</span>
        </button>

    </div>

</body>
</html>
